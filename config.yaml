# JUST Student Assistant Configuration

project:
  name: "JUST Student Assistant"

paths:
  cpt_data: "data/split_90_10/train"
  sft_data: "data/sft_final.jsonl"
  test_data: "data/tests/test_questions.csv"
  loss_curves: "results/loss_curves"
  model_results: "results/model_results"

model:
  name: "gpt2"

cpt:
  enabled: true
  output_dir: "results/cpt_model"

sft:
  enabled: true
  output_dir: "results/sft_model"

evaluation:
  test_file: "data/tests/test_questions.csv"
  output_dir: "results/model_results"
